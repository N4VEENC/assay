<style>

.dd{position:relative}.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}.ddb:hover{border-color:var(--acc)}.ddb b{font-size:10px;color:var(--mut)}

.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0}

.sg{display:flex;gap:5px;margin-top:10px}.sg i{flex:1;height:6px;background:var(--tint);position:relative}.sg u{position:absolute;inset:0 auto 0 0;background:var(--ink)}.sg .cur u{background:var(--acc)}.pl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pl b{font-weight:600}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:26px}
.qb{padding-bottom:30px;margin-bottom:30px;border-bottom:1px solid var(--line)}.qq{font-size:34px;line-height:1.18;letter-spacing:-.025em;font-weight:500;margin:10px 0}.qq.sm{font-size:24px}.qq em{color:var(--bad);font-style:normal}
.ops{margin:24px 0 8px;border-bottom:1px solid var(--line)}.o{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:15px 0;border-top:1px solid var(--line);font-size:17px;transition:padding .15s}.o:hover{padding-left:8px}
.o i{width:15px;height:15px;border:1.5px solid var(--mut);border-radius:50%;flex:none;font:10px/12px 'Fragment Mono';text-align:center;font-style:normal;color:var(--bg)}.o.on{font-weight:600}.o.on i{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--bg)}.o.on i:not(:empty){box-shadow:none}
.rt{display:flex;flex-wrap:wrap}.rt .o{width:auto;flex:1;justify-content:center;border-left:1px solid var(--line);min-width:44px;padding:15px 6px}.rt .o.on{background:var(--ink);color:var(--bg)}
.qa{display:flex;gap:24px;margin-top:10px}.err{color:var(--bad);min-height:22px;font-size:14px}.nv{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.lp{display:grid;grid-template-columns:190px 1fr 50px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tk{position:relative;height:1px;background:var(--ink)}.tk i{position:absolute;top:-6px;width:13px;height:13px;border-radius:50%;margin-left:-6px}.tk u{position:absolute;top:-8px;height:17px;border-left:1px dashed var(--mut)}
.hm{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center;padding:7px 0}.hm div{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}.hm i{height:24px}

.rb{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:26px}.kv{display:flex;gap:44px;flex-wrap:wrap;margin:14px 0 30px;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}.kv div{display:flex;flex-direction:column}.kv b{font-weight:500;font-size:17px}
.nm2{font-size:38px;font-weight:600;letter-spacing:-.03em;margin-top:18px}.hh{margin:30px 0 4px}
.lg{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.lg>div{padding:56px;display:flex;flex-direction:column;justify-content:space-between}.lg>:first-child{border-right:1px solid var(--ink)}.lg h1{font-size:56px;line-height:1.02;letter-spacing:-.04em;font-weight:600}.lb{max-width:360px;width:100%;margin:auto 0}.lb h2{font-size:28px;font-weight:600;letter-spacing:-.02em}.lb .sgm{margin:18px 0 6px}
#t{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;opacity:0;transition:.25s;z-index:20;pointer-events:none}#t.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.top,.pg,.bh{padding-left:18px;padding-right:18px}.rg,.lg,.bg,.g2{grid-template-columns:1fr;gap:26px}.lg>:first-child{display:none}.bg>*{padding:18px!important;border:0!important}.ed{padding-left:14px}.qq{font-size:26px}.lp,.hm{grid-template-columns:110px 1fr 40px}}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/"/g,'&quot;');
const TY={SHORT:['Short answer','▭'],LONG:['Paragraph','☰'],SINGLE:['Multiple choice','◉'],MULTI:['Checkboxes','☑'],DROP:['Dropdown','▾'],YN:['Yes / No','⇄'],SCALE:['Linear scale','┈'],RATING:['Rating','☆'],LIKERT:['Likert','▤'],NPS:['Net promoter','◔'],RANK:['Ranking','⇅'],DATE:['Date','▦'],TIME:['Time','◷'],NUM:['Number','#'],EMAIL:['Email','@'],FILE:['File upload','⇪']};
const TYI=Object.entries(TY).map(([k,v])=>[k,v[0],v[1]]),VAL=[['none','No validation','○'],['minlen','Minimum length','≥'],['maxlen','Maximum length','≤'],['range','Number range','↔'],['email','Email format','@'],['evid','Evidence required','⎘'],['date','Date range','▦']];
const DD=[["Governance",["Leadership accountability","Policy framework","Risk oversight"]],["Risk & Compliance",["Regulatory tracking","Control testing","Incident response"]],["Data & Technology",["Data quality","Access management","System resilience"]],["People & Culture",["Role clarity","Training and awareness","Speaking up"]],["Operations",["Process documentation","Supplier management","Continuity planning"]],["Performance",["Metrics and targets","Management reporting","Continuous improvement"]]];
const D=DD.map((d,i)=>({id:'d'+(i+1),name:d[0]})),P=["Is there a documented approach?","Is ownership clearly assigned?","Is it reviewed at least annually?","Can you evidence it working in practice?"],OPT=["Not in place","Partially in place","Largely in place","Fully embedded"];
const Q=[];DD.forEach((d,di)=>d[1].forEach(t=>P.forEach((p,pi)=>Q.push({id:'Q'+String(Q.length+1).padStart(3,'0'),dim:'d'+(di+1),topic:t,text:t+': '+p,type:pi==3?'LONG':pi==1?'YN':'SINGLE',mand:pi<2,ev:'e.g. policy document, audit report',val:'none',opts:[...OPT]}))));
const S={v:'login',role:'admin',pg:'ov',dim:'d1',sel:null,cur:16,ans:{},cm:{},st:{},all:0,done:0,modal:0,link:'',dd:null,dr:null,p:null,rt:'r',qf:'all',qo:null,dn:7};
Q.slice(0,16).forEach((q,i)=>S.ans[q.id]=q.type=='LONG'?'Policy v2.1 approved by the board, reviewed March 2026.':q.type=='YN'?0:(i*5+1)%4);S.st.Q005='review';S.st.Q009='draft';S.st.Q014='review';
const F=[['Maturity Assessment 2026','v3','Open',156,141,128,'04 Oct 2026, 10:15','31 Dec 2026, 18:00'],['Annual ESG Survey','v4','Open',320,198,143,'12 Sep 2026, 09:40','15 Dec 2026, 23:59'],['Data Privacy Check','v2','Published',90,12,4,'18 Nov 2026, 14:20','20 Jan 2027, 17:00'],['Vendor Security Review','v1','Draft',0,0,0,'19 Nov 2026, 11:05','—'],['Supplier Onboarding','v1','Saved',0,0,0,'15 Nov 2026, 16:32','—'],['Culture Pulse 2025','v2','Expired',240,212,212,'02 Sep 2025, 10:00','31 Oct 2026, 18:00']];
const SC={Open:'g',Published:'s',Draft:'',Saved:'h',Expired:'b'};
const R=[['Meera Iyer','Submitted',100,'74%','19 Nov 16:42'],['Daniel Reyes','Draft',22,'—','—'],['Arjun Mehta','Submitted',100,'68%','18 Nov 11:05'],['Sara Thomas','Draft',61,'—','—'],['Kiran Rao','Submitted',100,'81%','17 Nov 09:30']],DS=[78,64,71,59,82,67];
const q_=id=>Q.find(q=>q.id==id),d_=id=>D.find(d=>d.id==id),L=()=>D.flatMap(d=>Q.filter(q=>q.dim==d.id));
const opts=q=>q.type=='YN'?['Yes','No']:q.type=='LIKERT'?['Strongly disagree','Disagree','Neutral','Agree','Strongly agree']:q.opts,EO=q=>['SINGLE','MULTI','DROP','RANK'].includes(q.type);
const has=id=>{const v=S.ans[id];return v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)};
const tok=()=>Array.from({length:22},()=>'abcdefghijkmnpqrstuvwxyz23456789ABCDEFGH'[Math.random()*40|0]).join('');
const nid=()=>'Q'+String(Math.max(...Q.map(q=>+q.id.slice(1)))+1).padStart(3,'0');
function toast(m){const t=$('#t');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2000)}
function render(){$('#app').innerHTML=S.v=='login'?login():S.v=='admin'?admin():resp()}
document.addEventListener('click',()=>{if(S.dd){S.dd=null;render()}});
function dd(id,items,val,fn,w){const o=S.dd==id,c=items.find(x=>x[0]==val)||items[0];return `<div class="dd" ${w?`style="width:${w}"`:''}><button class="ddb" onclick="event.stopPropagation();S.dd=${o?'null':`'${id}'`};render()"><span><i>${c[2]}</i>${c[1]}</span><b>▾</b></button>${o?`<div class="ddm">${items.map(x=>`<button class="ddi ${x[0]==val?'on':''}" onclick="S.dd=null;${fn.replace('%k',x[0])}"><i>${x[2]}</i>${x[1]}</button>`).join('')}</div>`:''}</div>`}
const sw=(on,fn)=>`<button class="swt ${on?'on':''}" onclick="${fn}"><i></i></button>`;
function login(){return `<div class="lg"><div><div class="brand">assay<i>.</i></div><h1>Assessments,<br>read like a ledger.</h1><span class="eye">Assessment studio · 2026</span></div><div><span class="eye">Sign in</span><div class="lb"><h2>Welcome back</h2><div class="sgm">${['admin','respondent'].map(r=>`<button class="${S.role==r?'on':''}" onclick="S.role='${r}';render()">${r=='admin'?'Admin':'Respondent'}</button>`).join('')}</div><label>Email</label><input value="${S.role=='admin'?'priya.nair@acme.com':'daniel.reyes@acme.com'}"><label>Password</label><input type="password" value="password123"><button class="sol" style="width:100%;margin-top:30px" onclick="S.v=S.role=='admin'?'admin':'resp';S.pg='ov';render()">Sign in →</button></div><span></span></div></div>`}
function admin(){const n=[['ov','Forms'],['build','Builder'],['res','Responses']];return `<div class="top"><div class="brand">assay<i>.</i></div>${n.map(([k,t])=>`<button class="tab ${S.pg==k?'on':''}" onclick="S.pg='${k}';S.p=null;render()">${t}</button>`).join('')}<span class="sp"></span><button class="lk" onclick="S.v='resp';render()">Preview as respondent</button><span class="eye">Priya Nair · Admin</span><button class="lk" onclick="S.v='login';render()">Sign out</button></div>${S.pg=='ov'?ov():S.pg=='build'?build():res()}${S.modal?modal():''}`}
function ov(){return `<div class="pg"><div class="tbh"><button class="sol xl" onclick="S.pg='build';render();toast('New draft created')">+ New form</button></div><div class="tbw"><table><tr><th>Form</th><th>Status</th><th>Assigned</th><th>Responded</th><th>Not responded</th><th>Submitted</th><th>Not submitted</th><th>Completion</th><th>Created</th><th>Expires</th><th></th></tr>${F.map(f=>{const a=f[3],r=f[4],s=f[5],z=!a,p=z?0:Math.round(s/a*100),bp=z?0:(r-s)/a*100,sp=z?0:s/a*100;
return `<tr><td><b>${f[0]}</b><br><span class="mut num">${f[1]}</span></td><td><i class="dot ${SC[f[2]]}"></i>${f[2]}</td><td class="num">${z?'—':a}</td><td class="num">${z?'—':r+' / '+a}${z?'':`<div class="ln"><u style="width:${r/a*100}%"></u></div>`}</td><td class="num">${z?'—':`<i class="dot ${a-r?'b':'g'}"></i>${a-r}`}</td><td class="num">${z?'—':`<div class="tk2">${Array.from({length:10},(_,i)=>`<i class="${i<Math.round(s/a*10)?'f':''}"></i>`).join('')}</div>${s} / ${a}`}</td><td class="num">${z?'—':a-s}</td><td class="num">${z?'—':p+'%'}${z?'':`<div class="stk"><u style="width:${sp}%;background:var(--acc)"></u><u style="width:${bp}%;background:var(--hi)"></u></div>`}</td><td class="num">${f[6]}</td><td class="num">${f[7]}</td><td><button class="lk" onclick="S.pg='${a?'res':'build'}';render()">Open →</button></td></tr>`}).join('')}</table></div></div>`}
function build(){if(!d_(S.dim))S.dim=D[0]?.id;const d=d_(S.dim),qs=d?Q.filter(q=>q.dim==d.id):[];
return `<div class="bh"><div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><input class="ti" value="Maturity Assessment 2026"><span class="eye">v4 · draft · ${Q.length} questions</span></div><div style="display:flex;gap:22px;align-items:center"><button class="lk" onclick="toast('Imported 72 questions · 0 errors')">Import CSV / Excel</button><button class="lk" onclick="toast('Draft saved')">Save draft</button><button class="sol" onclick="S.modal=1;S.link='https://forms.acme.com/f/'+tok();render()">Publish</button></div></div>
<div class="bg"><div><div class="olh"><span class="eye">Dimensions</span><button class="ic" title="Add dimension" onclick="addD()">+</button></div><div>${D.map((x,i)=>`<div class="dm ${x.id==S.dim?'on':''}" data-k="d:${x.id}" ondragover="over(event,'d','${x.id}')" ondrop="endDrag()" onclick="S.dim='${x.id}';S.sel=null;render()"><span class="hd" draggable="true" ondragstart="ds(event,'d','${x.id}')" ondragend="endDrag()" onclick="event.stopPropagation()">⠿</span><span>${String(i+1).padStart(2,'0')} ${x.name}</span><span class="mo">${Q.filter(q=>q.dim==x.id).length}</span></div>`).join('')}</div></div>
<div>${d?`<div class="qh2"><input class="dn" value="${E(d.name)}" oninput="d_('${d.id}').name=this.value" onchange="render()"><button class="lk bad" onclick="delD('${d.id}')">Delete dimension</button></div><div>${qs.map(qw).join('')}</div><button class="lk" style="margin-top:18px" onclick="addQ()">+ Add question</button>`:'<p class="mut">No dimensions. Add one with +.</p>'}</div></div>`}
function qw(q){const o=S.sel==q.id,t=TY[q.type];return `<div data-k="q:${q.id}" ondragover="over(event,'q','${q.id}')" ondrop="endDrag()"><div class="qr ${o?'on':''}" onclick="S.sel=${o?'null':`'${q.id}'`};render()"><span class="hd" draggable="true" ondragstart="ds(event,'q','${q.id}')" ondragend="endDrag()" onclick="event.stopPropagation()">⠿</span><code>${q.id}</code><span>${q.text}</span><small><i>${t[1]}</i> ${t[0]}${q.mand?' <b>· req</b>':''}</small><b class="chev">${o?'▲':'▼'}</b></div>${o?ed(q):''}</div>`}
function ed(q){const i=q.id;return `<div class="ed"><label>Question</label><textarea rows="2" oninput="q_('${i}').text=this.value">${q.text}</textarea><div class="g2"><div><label>Question type</label>${dd('t'+i,TYI,q.type,`setQ('${i}','type','%k')`)}</div><div><label>Validation</label>${dd('v'+i,VAL,q.val,`setQ('${i}','val','%k')`)}</div></div>
${EO(q)?`<label>Options · score by position</label>${q.opts.map((x,k)=>`<div class="op"><span>${k}</span><input value="${E(x)}" oninput="q_('${i}').opts[${k}]=this.value"><button onclick="q_('${i}').opts.splice(${k},1);render()">✕</button></div>`).join('')}<button class="lk" style="margin-top:8px" onclick="q_('${i}').opts.push('New option');render()">+ Add option</button>`:''}
<label>Evidence / example hint</label><input value="${E(q.ev)}" oninput="q_('${i}').ev=this.value"><div class="tg"><span>Mandatory</span>${sw(q.mand,`setQ('${i}','mand',${!q.mand})`)}</div><div style="display:flex;gap:26px"><button class="lk" onclick="clone('${i}')">Clone</button><button class="lk bad" onclick="del('${i}')">Delete</button><button class="lk" style="color:var(--mut)" onclick="S.sel=null;render()">Close</button></div></div>`}
function setQ(id,k,v){q_(id)[k]=v;render()}
function clone(id){const a=q_(id),n={...a,id:nid(),opts:[...a.opts]};Q.splice(Q.indexOf(a)+1,0,n);S.sel=n.id;render();toast('Question cloned')}
function del(id){Q.splice(Q.indexOf(q_(id)),1);S.sel=null;render();toast('Question deleted')}
function addQ(){const n={id:nid(),dim:S.dim,topic:'New topic',text:'New question',type:'SINGLE',mand:false,ev:'',val:'none',opts:[...OPT]};Q.splice(Q.map(q=>q.dim).lastIndexOf(S.dim)+1||Q.length,0,n);S.sel=n.id;render()}
function addD(){const id='d'+(S.dn++);D.push({id,name:'New dimension'});S.dim=id;S.sel=null;render();toast('Dimension added')}
function delD(id){if(D.length<2){toast('Keep at least one dimension');return}const n=Q.filter(q=>q.dim==id).length;for(let i=Q.length-1;i>=0;i--)if(Q[i].dim==id)Q.splice(i,1);D.splice(D.findIndex(d=>d.id==id),1);S.dim=D[0].id;S.sel=null;render();toast('Dimension and '+n+' questions deleted')}
function flip(fn){const m={};document.querySelectorAll('[data-k]').forEach(e=>m[e.dataset.k]=e.getBoundingClientRect());fn();document.querySelectorAll('[data-k]').forEach(e=>{const o=m[e.dataset.k];if(!o)return;const n=e.getBoundingClientRect(),dy=o.top-n.top;if(dy){e.style.transition='none';e.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transition='transform .28s cubic-bezier(.2,.8,.2,1)';e.style.transform=''}))}})}
function ds(e,k,id){S.dr={k,id};const w=e.target.closest('[data-k]');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','x');e.dataTransfer.setDragImage(w,20,20);setTimeout(()=>w.classList.add('dg'),0)}
function over(e,k,id){e.preventDefault();const d=S.dr;if(!d||d.k!=k||d.id==id)return;const t=e.currentTarget,w=document.querySelector(`[data-k="${k}:${d.id}"]`);if(!w)return;const r=t.getBoundingClientRect(),after=e.clientY>r.top+Math.min(r.height,48)/2,arr=k=='q'?Q:D,a=arr.find(x=>x.id==d.id),b=arr.find(x=>x.id==id),ai=arr.indexOf(a),a2=arr.filter(x=>x!=a),at=a2.indexOf(b)+(after?1:0);if(at==ai)return;flip(()=>{a2.splice(at,0,a);arr.splice(0,arr.length,...a2);after?t.after(w):t.before(w)})}
function endDrag(){if(S.dr){S.dr=null;render();toast('Order updated')}}
function modal(){return `<div class="ov"><div class="dr"><span class="eye">Publish</span><h2>Share this assessment</h2><p class="mut" style="margin-top:6px">Publishing freezes v4. The link stays the same for later versions.</p><label>Expires</label><input type="datetime-local" value="2026-12-31T18:00"><label>Link</label><div style="display:flex;gap:14px;align-items:end"><input readonly value="${S.link}"><button class="lk" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.link).catch(()=>{});toast('Link copied')">Copy</button></div><div style="display:flex;gap:22px;margin-top:34px;flex-wrap:wrap"><button class="sol" onclick="S.modal=0;S.v='resp';S.cur=16;render()">Open as respondent</button><button class="lk" onclick="S.link='https://forms.acme.com/f/'+tok();render()">Regenerate</button><button class="lk" style="color:var(--mut)" onclick="S.modal=0;render()">Close</button></div></div></div>`}
const col=s=>s<55?'var(--bad)':s<70?'var(--hi)':'var(--acc)',SEG=['var(--bad)','var(--hi)','#7FA79F','var(--acc)'];
function ra(pi,q,i){const cnt=Math.round(R[pi][2]/100*72);if(i>=cnt)return['—',''];const h=(pi*31+i*17+7)%97;if(q.type=='LONG')return['Documented in policy v2, reviewed '+['Jan','Mar','Jun'][h%3]+' 2026.',''];const o=opts(q),k=q.type=='YN'?(h%5?0:1):h%o.length;return[o[k]??'—',q.type=='YN'?(k?0:3):k]}
function dist(i,n){const w=Array.from({length:n},(_,k)=>1+((i*[7,13,5,11][k]+k)%5)),s=w.reduce((a,b)=>a+b);return w.map(x=>Math.round(x/s*100))}
function exq(q,i){return `<table><tr><th>Respondent</th><th>Status</th><th>Answer</th><th>Score</th></tr>${R.map((r,pi)=>{const [a,s]=ra(pi,q,i);return `<tr><td style="width:28%"><b>${r[0]}</b></td><td style="width:16%"><i class="dot ${r[1]=='Submitted'?'g':''}"></i>${r[1]}</td><td style="${a=='—'?'color:var(--mut)':'font-weight:500'}">${a}</td><td class="num" style="width:60px">${s}</td></tr>`}).join('')}</table>`}
function res(){if(S.p!=null)return person();const rt=S.rt,l=L();
const tabs=`<div class="rb"><div class="sgm">${[['r','Respondents'],['q','By question'],['d','Dimensions']].map(([k,t])=>`<button class="${rt==k?'on':''}" onclick="S.rt='${k}';render()">${t}</button>`).join('')}</div><div style="display:flex;gap:24px"><button class="lk" onclick="csvAll(1)">Export all · wide ↓</button><button class="lk" onclick="csvAll(0)">Export all · long ↓</button></div></div>`;
if(rt=='r')return `<div class="pg">${tabs}<table><tr><th>Respondent</th><th>Status</th><th>Progress</th><th>Score</th><th>Submitted</th><th></th></tr>${R.map((r,i)=>`<tr class="cl" onclick="S.p=${i};render()"><td><b>${r[0]}</b></td><td><i class="dot ${r[1]=='Submitted'?'g':''}"></i>${r[1]}</td><td class="num">${r[2]}%<div class="ln"><u style="width:${r[2]}%"></u></div></td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="lk">View →</td></tr>`).join('')}</table></div>`;
if(rt=='d')return `<div class="pg">${tabs}<p class="eye" style="margin-bottom:8px">Average score per dimension, 0 to 100 · dashed line marks the 75% target</p><p class="num" style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:6px"><span><i class="dot g"></i>70 and above</span><span><i class="dot h"></i>55 to 69</span><span><i class="dot b"></i>below 55</span></p>${D.map((d,i)=>`<div class="lp"><span>${d.name}</span><div class="tk"><u style="left:75%"></u><i style="left:${DS[i%6]}%;background:${col(DS[i%6])}"></i></div><b class="mo">${DS[i%6]}</b></div>`).join('')}<p class="eye" style="margin:34px 0 6px">Average score of each question · click a cell to see every respondent's answer</p>${D.map((d,i)=>`<div class="hm"><span>${d.name}</span><div>${Q.filter(q=>q.dim==d.id).slice(0,12).map((q,k)=>{const s=35+((i*37+k*11)%60);return `<i title="${q.id} · ${s}%" onclick="S.rt='q';S.qf='${d.id}';S.qo='${q.id}';render()" style="cursor:pointer;background:${col(s)};opacity:${.4+s/150}"></i>`}).join('')}</div></div>`).join('')}</div>`;
const fq=l.filter(q=>S.qf=='all'||q.dim==S.qf);
return `<div class="pg">${tabs}<div style="max-width:300px;margin-bottom:18px">${dd('qf',[['all','All dimensions','▤'],...D.map(d=>[d.id,d.name,'◉'])],S.qf,`S.qf='%k';render()`)}</div><table><tr><th>ID</th><th>Question</th><th>Type</th><th>Answer distribution</th><th>Agreement</th><th></th></tr>${fq.map(q=>{const i=l.indexOf(q),t=TY[q.type],txt=['LONG','SHORT'].includes(q.type),dd_=dist(i,opts(q).length>1&&!txt?Math.min(opts(q).length,4):4),mx=Math.max(...dd_),ans=70+(i*7)%28;
const op=S.qo==q.id;return `<tr class="cl" onclick="S.qo=${op?'null':`'${q.id}'`};render()"><td class="mo">${q.id}</td><td>${q.text}</td><td class="mut num">${t[1]} ${t[0]}</td><td>${txt?`<span class="num">${ans}% answered</span><div class="stk"><u style="width:${ans}%;background:var(--acc)"></u></div>`:`<div class="stk" style="width:200px">${dd_.map((x,k)=>`<u title="${x}%" style="width:${x}%;background:${SEG[k+(4-dd_.length)]}"></u>`).join('')}</div>`}</td><td class="num">${txt?'—':mx>45?'Aligned':'Mixed'}</td><td class="chev">${op?'▲':'▼'}</td></tr>${op?`<tr><td colspan="6" class="ex">${exq(q,i)}</td></tr>`:''}`}).join('')}</table></div>`}
function person(){const pi=S.p,r=R[pi],l=L();return `<div class="pg"><div class="rb"><button class="lk" onclick="S.p=null;render()">← All responses</button><button class="sol" onclick="csvP(${pi})">Download CSV ↓</button></div><h2 class="nm2">${r[0]}</h2><div class="kv">${[['Status',r[1]],['Progress',r[2]+'%'],['Score',r[3]],['Version','v3'],['Submitted',r[4]]].map(([a,b])=>`<div><span class="eye">${a}</span><b>${b}</b></div>`).join('')}</div>${D.map(d=>`<h3 class="eye hh">${d.name}</h3><table>${Q.filter(q=>q.dim==d.id).map(q=>{const [a,s]=ra(pi,q,l.indexOf(q));return `<tr><td class="mo" style="width:70px">${q.id}</td><td>${q.text}</td><td style="width:34%;${a=='—'?'color:var(--mut)':'font-weight:500'}">${a}</td><td class="num" style="width:50px">${s}</td></tr>`}).join('')}</table>`).join('')}</div>`}
function dl(n,rows){const c=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=n;a.click();toast(n+' downloaded')}
const HD=['Question ID','Dimension','Topic','Question','Type','Answer','Score'],rows=(pi,l)=>l.map((q,i)=>{const [a,s]=ra(pi,q,i);return[q.id,d_(q.dim)?.name,q.topic,q.text,TY[q.type][0],a,s]});
function csvP(pi){dl(R[pi][0].toLowerCase().replace(' ','-')+'-response.csv',[HD,...rows(pi,L())])}
function csvAll(w){const l=L();dl(w?'all-responses-wide.csv':'all-responses-long.csv',w?[['Respondent','Status','Progress','Score','Submitted',...l.map(q=>q.id)],...R.map((r,pi)=>[r[0],r[1],r[2]+'%',r[3],r[4],...rows(pi,l).map(x=>x[5])])]:[['Respondent',...HD],...R.flatMap((r,pi)=>rows(pi,l).map(x=>[r[0],...x]))])}
function rw(b){return `<div class="top"><div class="brand">assay<i>.</i></div><span class="sp"></span><span class="eye">● Draft saved</span><button class="lk" onclick="fillAll()">Demo: fill all</button>${S.role=='admin'?'<button class="lk" onclick="S.v=\'admin\';render()">← Admin</button>':''}</div><div class="pg" style="padding-top:28px">${b}</div>`}
function resp(){const l=L(),t=l.length;if(S.done)return rw(`<span class="eye">Submitted · version 3</span><p class="qq" style="margin-top:14px">Thank you. Your response is submitted.</p><p class="mut" style="margin-bottom:26px">You can edit your answers until 31 Dec 2026, 18:00.</p><button class="sol" onclick="S.done=0;S.cur=0;render()">Edit my response</button>`);
const stx=q=>S.st[q.id]||(has(q.id)?'done':'pend'),dn=l.filter(x=>has(x.id)).length,cd=S.cur<t?l[S.cur].dim:null,gs=D.map(d=>{const a=l.filter(x=>x.dim==d.id);return[d,a,a.filter(x=>has(x.id)).length]}),cnt=s=>l.filter(q=>stx(q)==s).length,pc=(k,a)=>a.length?k/a.length*100:0;
const pr=`<div class="pl"><span class="eye">Overall progress</span><span><b>${dn}/${t}</b> answered · <b>${t-dn}</b> remaining</span></div><div class="sg">${gs.map(([d,a,k])=>`<i class="${d.id==cd?'cur':''}"><u style="width:${pc(k,a)}%"></u></i>`).join('')}</div>`;
const ix=`<div><p class="eye" style="margin-bottom:8px">Dimensions</p>${gs.map(([d,a,k],i)=>`<div class="ixd ${d.id==cd?'cur':''}"><button class="ixb" onclick="S.cur=${a.length?l.indexOf(a[0]):S.cur};render()"><span>${i+1}. ${d.name}</span><small><b>${k}/${a.length}</b> · ${a.length-k} left</small></button><div class="dots">${a.map(q=>`<button class="${stx(q)} ${l[S.cur]==q?'c':''}" title="${q.id} · ${stx(q)}" onclick="S.cur=${l.indexOf(q)};render()"></button>`).join('')}</div></div>`).join('')}<div class="lgd">${[['done','Answered'],['review','Review'],['draft','Draft'],['pend','Pending']].map(([s,n])=>`<span><i class="${s}"></i>${n} <b>${cnt(s)}</b></span>`).join('')}</div></div>`;
if(S.cur>=t){const miss=l.filter(q=>q.mand&&!has(q.id)).length;return rw(pr+`<div class="rg">${ix}<div><span class="eye">Review</span><p class="qq">Ready to submit?</p>${gs.map(([d,a,k])=>`<div class="lp" style="grid-template-columns:200px 1fr 60px"><span>${d.name}</span><div class="tk"><i style="left:${pc(k,a)}%;background:var(--acc)"></i></div><b class="mo">${k}/${a.length}</b></div>`).join('')}<div class="err" style="margin-top:12px">${miss?miss+' required questions are unanswered.':''}</div><div class="nv"><button class="lk" onclick="S.cur=${t-1};render()">← Back</button><button class="sol" onclick="sub()">Submit response</button></div></div></div>`)}
const q=l[S.cur],dq=l.filter(x=>x.dim==q.dim),tg=`<div class="tgl"><span class="eye">${d_(q.dim).name} · ${dq.length-dq.filter(x=>has(x.id)).length} left · show all questions</span>${sw(S.all,'S.all=!S.all;render()')}</div>`;
const body=S.all?dq.map(x=>qb(x,1)).join('')+`<div class="err" id="er"></div><div class="nv"><button class="lk" onclick="navD(-1)">← Previous dimension</button><button class="sol" onclick="navD(1)">Next dimension →</button></div>`:qb(q)+`<div class="err" id="er"></div><div class="nv"><button class="lk" onclick="nav(-1)">← Back</button><button class="lk" onclick="flag('${q.id}','draft')">Save draft</button><button class="sol" onclick="nav(1)">${S.cur==t-1?'Review':'Next'} →</button></div>`;
return rw(pr+`<div class="rg">${ix}<div>${tg}${body}</div></div>`)}
function qb(q,all){return `<div class="qb"><span class="eye">${q.topic} · ${q.id} · ${TY[q.type][1]} ${TY[q.type][0]}</span><p class="qq ${all?'sm':''}">${q.text}${q.mand?' <em>*</em>':''}</p><p class="mut">Evidence: ${q.ev||'—'}</p>${inp(q)}<label>Comment (optional)</label><textarea rows="2" oninput="S.cm['${q.id}']=this.value">${S.cm[q.id]||''}</textarea><div class="qa"><button class="lk" onclick="flag('${q.id}','review')">${S.st[q.id]=='review'?'✓ Marked for review':'Mark for review'}</button>${all?`<button class="lk" onclick="flag('${q.id}','draft')">${S.st[q.id]=='draft'?'✓ Saved as draft':'Save as draft'}</button>`:''}</div></div>`}
function inp(q){const v=S.ans[q.id],id=q.id,ty=q.type;
if(['SINGLE','YN','LIKERT','MULTI','RANK'].includes(ty))return `<div class="ops">${opts(q).map((o,i)=>{const a=Array.isArray(v),on=a?v.includes(i):v===i;return `<button class="o ${on?'on':''}" onclick="pick('${id}',${i})"><i>${ty=='RANK'&&on?v.indexOf(i)+1:''}</i>${o}</button>`}).join('')}</div>`;
if(ty=='DROP')return `<div style="margin-top:22px;max-width:360px">${dd('a'+id,[['','Select…','▾'],...q.opts.map((o,i)=>[String(i),o,'○'])],v===undefined?'':String(v),`S.ans['${id}']=%k===''?undefined:+'%k';render()`)}</div>`;
if(['SCALE','RATING','NPS'].includes(ty)){const a=ty=='NPS'?0:1,b=ty=='NPS'?10:5;return `<div class="ops rt">${Array.from({length:b-a+1},(_,i)=>i+a).map(i=>`<button class="o ${v===i?'on':''}" onclick="pick('${id}',${i})">${ty=='RATING'?(i<=v?'★':'☆'):i}</button>`).join('')}</div>`}
const m={DATE:'date',TIME:'time',NUM:'number',EMAIL:'email',FILE:'file',SHORT:'text'}[ty];
if(m)return `<input type="${m}" style="margin-top:22px" ${m=='file'?'':`value="${E(v)}"`} oninput="S.ans['${id}']=this.value">`;
return `<textarea style="margin-top:22px" rows="5" placeholder="Type your answer…" oninput="S.ans['${id}']=this.value">${v??''}</textarea>`}
function pick(id,i){const t=q_(id).type;if(t=='MULTI'||t=='RANK'){const a=S.ans[id]||[];S.ans[id]=a.includes(i)?a.filter(x=>x!=i):[...a,i]}else S.ans[id]=i;render()}
function flag(id,s){S.st[id]=S.st[id]==s?undefined:s;render();toast(s=='draft'?'Saved as draft':'Review flag updated')}
function nav(d){const q=L()[S.cur];if(d>0&&q.mand&&!has(q.id)){$('#er').textContent='This question is required.';return}if(d>0&&S.st[q.id]=='draft')S.st[q.id]=undefined;S.cur=Math.max(0,S.cur+d);render();scrollTo(0,0)}
function navD(d){const l=L(),cd=l[S.cur].dim;if(d>0&&l.filter(x=>x.dim==cd&&x.mand&&!has(x.id)).length){$('#er').textContent='Answer the required questions (*) first.';return}const di=D.findIndex(x=>x.id==cd)+d;if(di<0)return;const f=D[di]&&l.find(x=>x.dim==D[di].id);S.cur=D[di]?(f?l.indexOf(f):S.cur):l.length;render();scrollTo(0,0)}
function fillAll(){L().forEach((q,i)=>{if(!has(q.id))S.ans[q.id]=['LONG','SHORT','EMAIL'].includes(q.type)?'Evidence on file.':q.type=='MULTI'||q.type=='RANK'?[1]:q.type=='NPS'?8:['RATING','SCALE'].includes(q.type)?4:['NUM'].includes(q.type)?50:EO(q)||q.type=='YN'||q.type=='LIKERT'?(i*3+1)%opts(q).length:'2026-11-20'});S.cur=L().length;render();toast('Demo answers filled')}
function sub(){const l=L(),m=l.find(q=>q.mand&&!has(q.id));if(m){S.cur=l.indexOf(m);render();toast('Please answer required questions');return}S.done=1;render()}
render();
</script></body></html>
