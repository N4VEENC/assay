server:
  port: 8080
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password@1234}
  servlet:
    multipart:
      max-file-size: 5MB
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  admin-email: ${ADMIN_EMAIL:admin@assay.local}
  admin-password: ${ADMIN_PASSWORD:Admin@12345}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
